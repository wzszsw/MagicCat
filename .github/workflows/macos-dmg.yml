name: macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build macOS arm64 DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Build unsigned arm64 DMG
        run: bash scripts/build_macos.sh --arch arm64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MagicCat-macos-arm64
          path: dist/MagicCat-*-macos-arm64.dmg
          if-no-files-found: error
